# Installeurs : application de bureau (Windows .exe/.msi, macOS .dmg, Linux .deb/.AppImage) avec le Local Bridge embarqué,
# + le bridge autonome seul pour l'usage « application web + modèles locaux ». Déclenché par un tag vX.Y.Z.
# NON EXÉCUTÉ là où il a été écrit : à valider sur un premier tag de test (v0.0.0-test).
name: release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: "", triple: "" }
          - { os: macos-latest, args: "--target aarch64-apple-darwin", triple: aarch64-apple-darwin }   # Apple Silicon
          - { os: macos-13, args: "--target x86_64-apple-darwin", triple: x86_64-apple-darwin }         # Intel
          - { os: ubuntu-22.04, args: "", triple: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.triple }}" }
      - name: Dépendances système (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Bridge autonome (PyInstaller)
        shell: bash
        run: |
          pip install pyinstaller
          python bridge/build_bridge.py ${{ matrix.triple && format('--triple {0}', matrix.triple) || '' }}
          mkdir -p dist-bridge && cp frontend/src-tauri/binaries/aiw-bridge-* dist-bridge/
      - run: cd frontend && npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature (facultative, recommandée) : certificat Windows et notarisation Apple, à fournir en secrets du dépôt.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: "AI Workspace ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}
      - name: Joindre le bridge autonome à la release
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release upload "${{ github.ref_name }}" dist-bridge/aiw-bridge-* --clobber
