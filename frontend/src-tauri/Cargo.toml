[package]
name = "ai-workspace-desktop"
version = "0.1.0"
description = "AI Workspace — application de bureau (Windows, macOS, Linux)"
edition = "2021"

[lib]
name = "ai_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
